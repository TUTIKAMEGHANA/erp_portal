<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
  <style>
    body {
      background: url('https://picsum.photos/1200/800?grayscale') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    form {
      margin-top: 15%;
      font-size: 18px;
    }
    input, select {
      margin: 5px;
      padding: 8px;
    }
    button {
      padding: 8px 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Sign Up</h1>
  <form method="POST">
    <select name="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
    </select><br>
    <input type="text" name="username" placeholder="Username" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
