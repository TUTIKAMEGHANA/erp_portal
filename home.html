<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <style>
body {
    background: url('https://picsum.photos/1200/800?blur') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
}

.box {
    margin-top: 20%;
    background: rgba(0,0,0,0.35);
    display: inline-block;
    padding: 30px 50px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
}

h1 {
    font-size: 50px;
    text-shadow:
        0 0 10px rgba(0,0,0,0.8),
        2px 2px 8px rgba(0,0,0,1);
}

a {
    font-weight: bold;
    font-size: 24px;
    margin: 0 15px;
    color: yellow;
    text-decoration: none;
    text-shadow:
        0 0 10px rgba(0,0,0,0.8),
        2px 2px 8px rgba(0,0,0,1);
}

a:hover {
    color: white;
}
</style>
</head>
<body>
  <div class="box">
    <h1>Online Submission & Grading System</h1>
    <a href="/login">Login</a>
    <a href="/signup">Sign Up</a>
  </div>
</body>
</html>
